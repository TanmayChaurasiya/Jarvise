<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>JARVIS Voice Engine</title>
  </head>
  <body>
    <!-- This renderer is hidden and solely used to access navigator.mediaDevices -->
    <script>
      const { ipcRenderer } = require('electron');
      
      let mediaRecorder;
      let audioChunks = [];

      async function startListening() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          // Use webm for high compression and easy transmission
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              audioChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const arrayBuffer = await audioBlob.arrayBuffer();
            const buffer = Buffer.from(arrayBuffer);
            
            // Send the raw buffer to the main process
            ipcRenderer.send('voice-buffer-ready', buffer);
            
            // Cleanup
            audioChunks = [];
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          console.log('[HiddenRenderer] Started recording...');
          
          // For JARVIS, we could use a Voice Activity Detection (VAD) algorithm here.
          // For now, we simulate a 3-second recording window when triggered.
          setTimeout(() => {
            stopListening();
          }, 3000);

        } catch (error) {
          console.error('[HiddenRenderer] Error accessing microphone:', error);
          ipcRenderer.send('voice-error', error.message);
        }
      }

      function stopListening() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
          console.log('[HiddenRenderer] Stopped recording.');
        }
      }

      // Main process triggers recording
      ipcRenderer.on('start-listening', () => {
        startListening();
      });
    </script>
  </body>
</html>
